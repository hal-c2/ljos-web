[package]
name = "wasm-counter"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Spike: a Rust Counter as a QML type in the browser (docs/LJOS_WEB.md)"

# Its own workspace: an application crate, as an Ljós application's native
# module is, not a part of the compiler's.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The CLI that reads what this writes into the .wasm must be the same
# version; the mise task fetches 0.2.114 (see mise-tasks/wasm-counter).
wasm-bindgen = "=0.2.114"
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
