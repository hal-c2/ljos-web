[package]
name = "wasm-counter"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "A Rust Counter as a QML type in the browser, from the same source as on the desktop (docs/LJOS_WEB.md A22)"

# Its own workspace: an application crate, as an Ljós application's native
# module is, not a part of the compiler's.
[workspace]

[features]
# All an application's manifest says for the web: `ljos-web faces` builds with it.
web = ["ljos/web"]

[dependencies]
ljos = { git = "ssh://git@github.com/hal-c2/ljos-ui.git", rev = "f8e705d4e206e45e20f04c5645e9e8a62f68317f", default-features = false }
