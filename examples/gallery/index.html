<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ljos-web: Qt's examples on the web</title>
    <style>
      body { margin: 0; background: #f4f4f1; color: #1c1c1c; font: 14px/1.4 system-ui, sans-serif; }
      /* An example's window: its size, Qt's white, and the font Qt has when
         nothing sets one (the platform's sans serif at 9pt, which is 12px). */
      #stage { position: relative; overflow: hidden; background: white; color: black; font: 12px sans-serif; }
      #about { padding: 12px 16px; }
      #about pre { white-space: pre-wrap; color: #a4262c; }
      #about img { display: block; max-width: 100%; border: 1px solid #ccc; }
      table { border-collapse: collapse; }
      th, td { text-align: left; vertical-align: top; padding: 6px 12px; border-bottom: 1px solid #ddd; }
      td img { max-width: 160px; max-height: 120px; border: 1px solid #ccc; }
      .no { color: #777; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="about"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
