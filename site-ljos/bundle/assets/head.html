<meta name="color-scheme" content="light dark" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="%LIGHT_CANVAS%" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="%DARK_CANVAS%" />
<meta property="og:image" content="https://ljos.dev/og-image.png" />
<meta property="og:site_name" content="Ljós" />
<!-- The scheme the reader picked (scheme.js keeps it, under the key the
     build writes in here from it), on the root before the body is read,
     so the first paint is already in it. -->
<script>try{const s=localStorage.getItem(%SCHEME_KEY%);if(s==="light"||s==="dark"){const r=document.documentElement;r.dataset.ljosScheme=s;r.style.colorScheme=s;for(const m of document.querySelectorAll('meta[name="theme-color"]'))m.content=s==="dark"?"%DARK_CANVAS%":"%LIGHT_CANVAS%"}}catch{}</script>
<!-- The shell the reader picked (shells.js keeps it): every page is
     written in the marketing shell, and another is put in once the page
     has been taken over. Where one is kept and the window has room for
     it, the page waits unseen until it is in (shells.js `shown`), so
     the reader never sees one shell turn into another; if that never
     comes, it shows anyway, and says so (`data-ljos-shell-late`) as
     the page starts to show: the page then stays in the shell it is
     being shown in (Main.qml `late`). Said on a timer as well as when
     the fade starts: a browser in the middle of a view transition
     sends no animation events until the transition is let go, which
     is what being late has to do. A reader with no script runs none
     of this. -->
<script>try{const k=localStorage.getItem(%SHELL_KEY%);if((k==="workbench"||k==="desktop")&&innerWidth>=%WIDE_FROM%){const r=document.documentElement;r.dataset.ljosShell=k;const l=()=>{if(!("ljosShellShown"in r.dataset))r.dataset.ljosShellLate=""};setTimeout(l,%SHELL_WAIT%);addEventListener("animationstart",e=>{if(e.animationName==="ljos-shell-late")l()})}}catch{}</script>
<!-- The design tokens as the HTML around the app reads them: the
     build writes tokens.js's colours here as `--ljos-<role>` and
     `--ljos-code-<tag>` (which the code blocks' `.tok-<tag>` classes
     read), for light, for dark as the browser asks, and for dark as
     the reader picked. -->
<style>
%LJOS_TOKENS%
  html, body { background: var(--ljos-canvas); color: var(--ljos-text); }
  :focus-visible { outline: 2px solid var(--ljos-focus); outline-offset: 2px; }
  /* A link's ring is its own words' colour, which already stands out
     from whatever it is written on (a button's accent, too). */
  #app a:focus-visible { outline-color: currentColor; }
  ::selection { background: var(--ljos-code-selection); }
  /* A code editor's text starts at its own edge, and the field clips
     (or scrolls) code wider than it, so a ring of its own would cross
     the first column or be cut off: the box around it draws the ring
     (Site/CodeBlock.qml, Demos/PantryDemo.qml). */
  #app .cm-editor.cm-focused { outline: none; }
  /* Not under #app alone: the runtime measures where markup wraps in a
     bench beside the app, which must set inline code the same way. */
  .qq-markup code:not(pre code) {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
    font-size: 0.875em;
    padding: 0.1em 0.35em;
    border-radius: 4px;
    background: var(--ljos-code-bg);
    color: var(--ljos-code-fg);
  }
  #app .qq-markup a { text-underline-offset: 0.15em; }
  .tok-keyword { color: var(--ljos-code-keyword); }
  .tok-string { color: var(--ljos-code-string); }
  .tok-number { color: var(--ljos-code-number); }
  .tok-bool { color: var(--ljos-code-bool); }
  .tok-null { color: var(--ljos-code-null); }
  .tok-regexp { color: var(--ljos-code-regexp); }
  .tok-comment { color: var(--ljos-code-comment); font-style: italic; }
  .tok-typeName { color: var(--ljos-code-typeName); }
  .tok-propertyName { color: var(--ljos-code-propertyName); }
  .tok-variableName { color: var(--ljos-code-variableName); }
  .tok-function { color: var(--ljos-code-function); }
  .tok-operator { color: var(--ljos-code-operator); }
  .tok-punctuation { color: var(--ljos-code-punctuation); }
  .tok-meta { color: var(--ljos-code-meta); }
  .tok-invalid { color: var(--ljos-code-invalid); }
  .tok-topic { color: var(--ljos-code-topic); }
  /* The kept shell's page, held back until it is in (above). */
  :root[data-ljos-shell]:not([data-ljos-shell-shown]) #app { opacity: 0; animation: ljos-shell-late 160ms ease-out %SHELL_WAIT%ms forwards; }
  :root[data-ljos-shell][data-ljos-shell-shown] #app { animation: ljos-shell-in 160ms ease-out; }
  @keyframes ljos-shell-late { to { opacity: 1; } }
  @keyframes ljos-shell-in { from { opacity: 0; } }
  /* A shell swapped live (shells.js `swap`): the last one sinks back and
     the next rises into its place; with reduced motion they crossfade,
     nothing moving. */
  :root[data-ljos-swap="rich"]::view-transition-old(root) { animation: ljos-swap-out 180ms cubic-bezier(0.4, 0, 1, 1) both; }
  :root[data-ljos-swap="rich"]::view-transition-new(root) { animation: ljos-swap-in 360ms cubic-bezier(0.16, 1, 0.3, 1) 60ms both; }
  :root[data-ljos-swap="calm"]::view-transition-old(root) { animation: ljos-fade-out 220ms ease both; }
  :root[data-ljos-swap="calm"]::view-transition-new(root) { animation: ljos-fade-in 220ms ease both; }
  @keyframes ljos-swap-out { to { opacity: 0; transform: scale(0.98); } }
  @keyframes ljos-swap-in { from { opacity: 0; transform: translateY(16px) scale(1.01); } }
  @keyframes ljos-fade-out { to { opacity: 0; } }
  @keyframes ljos-fade-in { from { opacity: 0; } }
</style>
<!-- With no script a Flickable is only a scroller, as folded code is
     (Site/CodeBlock.qml): it shows its bar, and at its end the page
     goes on. -->
<noscript><style>
  #app qq-flick { overscroll-behavior-y: auto !important; scrollbar-width: thin; }
  #app qq-flick::-webkit-scrollbar { display: block; }
</style></noscript>
