[workspace]
resolver = "3"
members = ["crates/ljos_web", "crates/ljos_web_3d", "crates/ljos_web_compiler", "crates/ljos_web_kernel"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"

# The QML parser is Ljós's `qml_syntax` (its oxc fork lives there, never
# here). Plain JavaScript is read by that same fork (`ljos_oxc_parser`,
# library `oxc_parser`), so there is one copy of oxc's parser.

[profile.dev]
debug = "line-tables-only"

# The kernel's wasm: it is in every page, and a tracked read crosses into
# it. `opt-level = 2` is both smaller and faster than "z" or "s" here: at
# "z" nothing on the read path is inlined, so a read is five calls deep
# (and a write ~3.5x slower), while the inlining folds away more code than
# it copies. Measured with `mise run build:kernel` and the read bench.
[profile.wasm]
inherits = "release"
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The compiler a page loads the first time it compiles QML: once per page,
# off any path a frame waits on, so the smallest. "z" is 1,084 kB gzip
# against 1,251 kB at "s" and 1,366 kB at 2.
[profile.compiler]
inherits = "wasm"
opt-level = "z"

# View3D's renderer: its own chunk, fetched the first time a page makes a
# View3D, and drawing frames, so not at "z"'s cost. Sized in size/check.js.
[profile.view3d]
inherits = "wasm"
opt-level = "s"
