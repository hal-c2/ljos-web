[workspace]
resolver = "3"
members = ["crates/qml_solid"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"

# The QML parser is Ljós's `qml_syntax` (its oxc fork lives there, never
# here); `oxc_parser` from crates.io remains only for plain JavaScript.

[profile.dev]
debug = "line-tables-only"
