[workspace]
resolver = "3"
members = ["crates/ljos_web", "crates/ljos_web_kernel"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"

# The QML parser is Ljós's `qml_syntax` (its oxc fork lives there, never
# here); `oxc_parser` from crates.io remains only for plain JavaScript.

[profile.dev]
debug = "line-tables-only"

# The kernel's wasm, as small as it can be made: it is in every page.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
