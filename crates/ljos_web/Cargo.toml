[package]
name = "ljos_web"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
qml_front = { git = "ssh://git@github.com/hal-c2/ljos-ui.git", rev = "2d725000e02f496072063adace4064c205fcb5cd" }
qt_types = { git = "ssh://git@github.com/hal-c2/ljos-ui.git", rev = "2d725000e02f496072063adace4064c205fcb5cd" }
qml_syntax = { git = "ssh://git@github.com/hal-c2/ljos-ui.git", rev = "2d725000e02f496072063adace4064c205fcb5cd" }
# The theme file's reader and checker. The pin is ljos-ui's main as
# `Ljos.Ui` came to the web: the first whose type table knows Ljós's
# own modules, so a dialect file compiles here (docs/LJOS_WEB.md A29).
ljos_design = { git = "ssh://git@github.com/hal-c2/ljos-ui.git", rev = "2d725000e02f496072063adace4064c205fcb5cd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# What a dropped shell compiles to: data the page runs, not code.
ljos_ir = { git = "ssh://git@github.com/hal-c2/ljos-ui.git", rev = "2d725000e02f496072063adace4064c205fcb5cd" }
blake3 = "1"
oxc_allocator = "0.144"
oxc_ast = "0.144"
oxc_ast_visit = "0.144"
oxc_codegen = "0.144"
oxc_diagnostics = "0.144"
oxc_parser = "0.144"
oxc_semantic = "0.144"
oxc_span = "0.144"
oxc_str = "0.144"
oxc_syntax = "0.144"
solidjs-compiler = { path = "../../vendor/solidjs-compiler", default-features = false }
