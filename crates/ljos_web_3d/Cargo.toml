[package]
name = "ljos_web_3d"
description = "View3D for ljos-web: the page's QtQuick3D objects read into ljos_3d's scene and drawn by its wgpu renderer"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The mapping is tested natively, so that needs no renderer; the page draws.
[dependencies]
ljos_3d = { git = "ssh://git@github.com/hal-c2/ljos-ui.git", rev = "cb4a991ab27688b36b1c13184fc387ab4eab8086", default-features = false, features = ["gltf", "snippets"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ljos_3d = { git = "ssh://git@github.com/hal-c2/ljos-ui.git", rev = "cb4a991ab27688b36b1c13184fc387ab4eab8086", default-features = false, features = ["gpu", "gltf", "snippets"] }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }
wgpu = { version = "30.0.1", default-features = false }
