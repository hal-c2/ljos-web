[package]
name = "ljos_web_compiler"
description = "ljos-web's QML compiler (ljos_web::given) as wasm, for a page that compiles QML"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ljos_web = { path = "../ljos_web" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
