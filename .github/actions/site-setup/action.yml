name: site setup
description: >-
  What every site.yml job that builds or tests starts with: the pinned
  tools, the JavaScript packages, and on request the Rust artefacts the
  rust job built, the ljos-ui docs at the pinned revision, and Chromium.
inputs:
  rust:
    description: "Install Rust too (the rust job builds; the others download what it built)"
    default: "false"
  artefacts:
    description: "Download the rust job's qmlc and wasm into the places the tasks build them"
    default: "false"
  docs:
    description: "Fetch ljos-ui's docs/site at site/ljos-ui.sha (mise run site:docs) and set LJOS_DOCS_DIR"
    default: "false"
  browser:
    description: "Install Chromium and what it needs of the system"
    default: "false"
  packages:
    description: "Install the JavaScript packages"
    default: "true"
outputs:
  drawing:
    description: "A hash of the fonts and libraries Chromium draws the prerenders' pictures with (with browser only)"
    value: ${{ steps.drawing.outputs.hash }}
  inputs:
    description: "A hash of everything a code block's prerender can be made from"
    value: ${{ steps.keys.outputs.inputs }}
  pictures:
    description: "A hash of the script that draws the Ljós site's pictures"
    value: ${{ steps.keys.outputs.pictures }}
runs:
  using: composite
  steps:
    # A job that only runs JavaScript installs Node and pnpm alone: the
    # Rust toolchain is the largest part of mise's cache, and only the
    # rust job compiles. install_args is part of mise-action's cache key,
    # so the two kinds keep caches of their own.
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        version: 2026.9.9
        install_args: ${{ inputs.rust != 'true' && 'node pnpm' || '' }}
    - shell: bash
      run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
    # The pnpm store, by lockfile: an install then links rather than
    # downloads. Saved by whichever job first misses it.
    - if: inputs.packages == 'true'
      id: pnpm-store
      shell: bash
      run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - if: inputs.packages == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.dir }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - if: inputs.packages == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.artefacts == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: rust-artefacts
    # An artifact keeps no file modes.
    - if: inputs.artefacts == 'true'
      shell: bash
      run: chmod +x target/debug/qmlc
    - if: inputs.docs == 'true'
      shell: bash
      run: echo "LJOS_DOCS_DIR=$(mise-tasks/site/docs)" >> "$GITHUB_ENV"
    # One Chromium for both sites' suites and the build's pictures, kept
    # between runs by Playwright's version (one in the lockfile). What
    # it needs of the system is installed each run either way, and the
    # cache is saved as soon as it is filled: one saved at the job's end
    # is lost to any failing test after it.
    - if: inputs.browser == 'true'
      id: playwright
      shell: bash
      run: |
        echo "version=$(sed -n 's/^  playwright@\([0-9.]*\):$/\1/p' pnpm-lock.yaml | head -n1)" >> "$GITHUB_OUTPUT"
        echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
        echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
    # What Chromium needs of the system is some 30 MB of fonts and Mesa
    # that the runner's Ubuntu mirror hands out at about 120 kB/s: four
    # minutes and more of every job with a browser, longer than its
    # tests. apt is pointed at a directory of its own and told to keep
    # what it fetches there, which is cached by the runner's image (so
    # it moves weekly, as the images do) and Playwright's version; it
    # then fetches only what the mirror has newer. A run's jobs land on
    # several images, so one whose image has no cache yet starts from
    # another image's: apt takes a package from it only where its
    # version is the one wanted, and fetches the rest. Only the packages
    # are kept: apt's lock and partial downloads are root's.
    - if: inputs.browser == 'true'
      id: debs
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-debs/*.deb
        key: playwright-debs-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
        restore-keys: playwright-debs-${{ steps.playwright.outputs.os }}-
    - if: inputs.browser == 'true'
      shell: bash
      run: |
        mkdir -p ~/.cache/playwright-debs/partial
        printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' ~/.cache/playwright-debs \
          | sudo tee /etc/apt/apt.conf.d/90playwright-debs > /dev/null
    - if: inputs.browser == 'true'
      id: browsers
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: inputs.browser == 'true' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter ljos-site exec playwright install --with-deps chromium
    - if: inputs.browser == 'true' && steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --filter ljos-site exec playwright install-deps chromium
    - if: inputs.browser == 'true' && steps.browsers.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browsers.outputs.cache-primary-key }}
    # apt keeps every package it fetches and never drops an older one,
    # so a cache started from another image's would carry each version
    # of the fonts and Mesa from then on. What is saved is only what
    # this job installed, at the version it installed. A machine whose
    # installed packages can't be read saves nothing, and goes on: the
    # cache is a head start, not a part of the job.
    - if: inputs.browser == 'true' && steps.debs.outputs.cache-hit != 'true'
      id: kept
      continue-on-error: true
      shell: bash
      run: bash .github/scripts/keep-installed-debs.sh ~/.cache/playwright-debs
    - if: inputs.browser == 'true' && steps.debs.outputs.cache-hit != 'true' && steps.kept.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-debs/*.deb
        key: ${{ steps.debs.outputs.cache-primary-key }}
    # What the code blocks' prerender caches are keyed by. Each entry
    # names the compiler, runtime, lockfile and kernel that made it
    # (prerenderStamp), and one made by others is made again, so an
    # older run's cache is only ever a head start: what the build embeds
    # is what a build from nothing would. The pictures are drawn with
    # the runner's fonts and graphics libraries, which no stamp names,
    # so the keys start with what those are (drawn-with.sh): a runner
    # that draws otherwise starts from nothing, and the images a run's
    # jobs land on, which draw alike, share one cache. It is read once
    # Playwright has installed what Chromium needs of the system, where
    # most of it comes from. The key moves with everything a block can
    # be made from, so a run that made nothing new saves nothing. The
    # files the docs' examples are given (site/codeblock-files) are part
    # of an example's hash, so of the key. The Ljós site's pictures are
    # also drawn by its build script, so its keys move with that script
    # too (pictures); each picture's name holds the same recipe, so one
    # restored from an older key is drawn again, never shown.
    - if: inputs.browser == 'true'
      id: drawing
      shell: bash
      run: |
        hash=$(bash .github/scripts/drawn-with.sh)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
    - id: keys
      shell: bash
      env:
        INPUTS: ${{ hashFiles('packages/runtime/**', 'crates/**', 'vendor/**', 'Cargo.lock', 'pnpm-lock.yaml', 'site/ljos-ui.sha', 'site/codeblock-files/**', '!**/node_modules/**') }}
        PICTURES: ${{ hashFiles('site-ljos/scripts/build.mjs') }}
      run: |
        echo "inputs=$INPUTS" >> "$GITHUB_OUTPUT"
        echo "pictures=$PICTURES" >> "$GITHUB_OUTPUT"
