name: site setup
description: >-
  What every site.yml job that builds or tests starts with: the pinned
  tools, the JavaScript packages, and on request the Rust artefacts the
  rust job built, the ljos-ui docs at the pinned revision, and Chromium.
inputs:
  rust:
    description: "Install Rust too (the rust job builds; the others download what it built)"
    default: "false"
  artefacts:
    description: "Download the rust job's qmlc and wasm into the places the tasks build them"
    default: "false"
  docs:
    description: "Fetch ljos-ui's docs/site at site/ljos-ui.sha (mise run site:docs) and set LJOS_DOCS_DIR"
    default: "false"
  browser:
    description: "Install Chromium and what it needs of the system"
    default: "false"
  packages:
    description: "Install the JavaScript packages"
    default: "true"
outputs:
  image:
    description: "The runner's image, which draws the prerenders' pictures with its fonts"
    value: ${{ steps.image.outputs.name }}
  inputs:
    description: "A hash of everything a code block's prerender can be made from"
    value: ${{ steps.image.outputs.inputs }}
  pictures:
    description: "A hash of the script that draws the Ljós site's pictures"
    value: ${{ steps.image.outputs.pictures }}
runs:
  using: composite
  steps:
    # A job that only runs JavaScript installs Node and pnpm alone: the
    # Rust toolchain is the largest part of mise's cache, and only the
    # rust job compiles. install_args is part of mise-action's cache key,
    # so the two kinds keep caches of their own.
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        version: 2026.9.9
        install_args: ${{ inputs.rust == 'true' && '' || 'node pnpm' }}
    - shell: bash
      run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
    # The pnpm store, by lockfile: an install then links rather than
    # downloads. Saved by whichever job first misses it.
    - if: inputs.packages == 'true'
      id: pnpm-store
      shell: bash
      run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - if: inputs.packages == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.dir }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - if: inputs.packages == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.artefacts == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: rust-artefacts
    # An artifact keeps no file modes.
    - if: inputs.artefacts == 'true'
      shell: bash
      run: chmod +x target/debug/qmlc
    - if: inputs.docs == 'true'
      shell: bash
      run: echo "LJOS_DOCS_DIR=$(mise-tasks/site/docs)" >> "$GITHUB_ENV"
    # One Chromium for both sites' suites and the build's pictures, kept
    # between runs by Playwright's version (one in the lockfile). What
    # it needs of the system is installed each run either way, and the
    # cache is saved as soon as it is filled: one saved at the job's end
    # is lost to any failing test after it.
    - if: inputs.browser == 'true'
      id: playwright
      shell: bash
      run: echo "version=$(sed -n 's/^  playwright@\([0-9.]*\):$/\1/p' pnpm-lock.yaml | head -n1)" >> "$GITHUB_OUTPUT"
    - if: inputs.browser == 'true'
      id: browsers
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: inputs.browser == 'true' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter ljos-site exec playwright install --with-deps chromium
    - if: inputs.browser == 'true' && steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --filter ljos-site exec playwright install-deps chromium
    - if: inputs.browser == 'true' && steps.browsers.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browsers.outputs.cache-primary-key }}
    # What the code blocks' prerender caches are keyed by. Each entry
    # names the compiler, runtime, lockfile and kernel that made it
    # (prerenderStamp), and one made by others is made again, so an
    # older run's cache is only ever a head start: what the build embeds
    # is what a build from nothing would. The pictures are drawn with
    # the runner's fonts, so a runner image of its own starts from
    # nothing. The key moves with everything a block can be made from,
    # so a run that made nothing new saves nothing. The files the docs'
    # examples are given (site/codeblock-files) are part of an example's
    # hash, so of the key. The Ljós site's pictures are also drawn by its
    # build script, so its keys move with that script too (pictures);
    # each picture's name holds the same recipe, so one restored from an
    # older key is drawn again, never shown.
    - id: image
      shell: bash
      env:
        INPUTS: ${{ hashFiles('packages/runtime/**', 'crates/**', 'vendor/**', 'Cargo.lock', 'pnpm-lock.yaml', 'site/ljos-ui.sha', 'site/codeblock-files/**', '!**/node_modules/**') }}
        PICTURES: ${{ hashFiles('site-ljos/scripts/build.mjs') }}
      run: |
        echo "name=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
        echo "inputs=$INPUTS" >> "$GITHUB_OUTPUT"
        echo "pictures=$PICTURES" >> "$GITHUB_OUTPUT"
