name: site

on:
  pull_request:
    paths: ["site/**", "packages/**", "crates/**", "pnpm-workspace.yaml", ".github/workflows/site.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages (still no custom domain)"
        type: boolean
        default: false

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Docs, at the pinned ljos-ui revision
        run: |
          git clone https://github.com/hal-c2/ljos-ui "$RUNNER_TEMP/ljos-ui"
          git -C "$RUNNER_TEMP/ljos-ui" checkout "$(cat site/ljos-ui.sha)"
          echo "LJOS_DOCS_DIR=$RUNNER_TEMP/ljos-ui/docs/site" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.9.9
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      - run: cargo build --bin qmlc --locked
      - run: pnpm --filter ljos-site build
      - run: pnpm --filter ljos-site check-links
      - run: pnpm --filter ljos-site exec playwright install --with-deps chromium
      - run: pnpm --filter ljos-site test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-dist
          path: site/dist
      # DECISION: no CNAME, no domain. Pages deploys only on a manual
      # dispatch that asks for it; pointing ljos.dev here is separate.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: ${{ inputs.deploy == true }}
        with:
          path: site/dist
  deploy:
    if: ${{ inputs.deploy == true }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
