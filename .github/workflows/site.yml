name: site

on:
  # A pull request builds and tests, and never deploys. The paths are
  # everything the build reads: a file left out here is a merge that
  # changes the site and never deploys it. The freshness guard reads
  # the same list from .github/scripts/site-paths.txt; a test holds
  # the three equal.
  pull_request:
    paths: ["site/**", "site-ljos/**", "packages/**", "crates/**", "vendor/**", "mise-tasks/**", "mise.toml", "Cargo.toml", "Cargo.lock", ".cargo/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/site.yml", ".github/scripts/**", ".github/actions/**"]
  # A merge to main is live: it deploys to the repository's Pages
  # custom domain (ljos.dev). The same paths as pull_request, so what
  # a pull request was held to is what deploys.
  push:
    branches: [main]
    paths: ["site/**", "site-ljos/**", "packages/**", "crates/**", "vendor/**", "mise-tasks/**", "mise.toml", "Cargo.toml", "Cargo.lock", ".cargo/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/site.yml", ".github/scripts/**", ".github/actions/**"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy site-ljos to GitHub Pages (the github.io preview unless custom_domain)"
        type: boolean
        default: false
      custom_domain:
        description: "Build for the repository's Pages custom domain, at its root, and ship its CNAME (only once DNS and the domain are set; see site-ljos/README.md)"
        type: boolean
        default: false
      rollback:
        description: "Deploy an older commit of main on purpose, although a newer one has changed the site (dispatch from a branch at it; see site-ljos/README.md)"
        type: boolean
        default: false

permissions:
  contents: read

# Who waits for whom. A pull request's run, and a fork's push to its
# main (which never deploys), is superseded by a newer one on its ref.
# A run that may deploy (a push to main in hal-c2/ljos-web, or any
# dispatch) has a group of its own, so it never waits behind another
# run to build and test: only its deploy job takes turns, in the Pages
# group below. Before, every deploying run shared one group for the
# whole run, so a newer merge waited while an older one built for an
# hour only for the freshness guard to refuse its deploy at the end.
# The workflow's concurrency never cancels a run that may deploy:
# cancel-in-progress cancels a run whole, its deploy-pages mid-flight
# included. A newer push to main supersedes the older ones through the
# supersede job instead, which cancels an older push's run only while
# its deploy job has not started. What keeps an older commit from
# landing after a newer one is the freshness guard
# (.github/scripts/fresh-head.sh): the `fresh` job runs it before a
# run's deploy may take its turn, and the deploy job again right before
# deploy-pages. A build that is no longer the newest site its branch
# holds (a commit since its own changes a path the site is built from,
# site-paths.txt, the same list as the filters above) is answered
# fresh=false in a push's run, and its deploy is skipped: it never
# waits for a turn it would only refuse, and the newer push's run
# deploys. A stale dispatch fails there instead, as nothing else will
# deploy what was asked for. A commit that changes none of those paths starts
# no run, so the run's build is still the newest site and deploys. A
# dispatch with rollback on passes the guard for a commit main holds,
# to put an older commit of main live on purpose. The group is decided
# before any job runs, so it says "may deploy" in the words the build
# job's SITE_DEPLOYS uses.
concurrency:
  group: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hal-c2/ljos-web') || github.event_name == 'workflow_dispatch') && format('site-run-{0}', github.run_id) || format('site-{0}', github.ref) }}
  cancel-in-progress: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hal-c2/ljos-web') || github.event_name == 'workflow_dispatch') }}

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # A newer push to main makes an older push's build waste: the
  # freshness guard would skip its deploy. Cancelled here, the older
  # run stops holding runners the newer build needs.
  supersede:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hal-c2/ljos-web' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Cancelling the older runs.
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - run: .github/scripts/supersede.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
  # Every QML file both sites show is checked by `ljos check` at the
  # pinned revision: the demos, and the docs' blocks through ljos-ui's
  # own docs_site test, which knows each fence's harness and what is
  # still listed as missing. A job of its own so it runs beside the
  # long build rather than after it.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: pin
        run: echo "sha=$(cat site/ljos-ui.sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hal-c2/ljos-ui
          ref: ${{ steps.pin.outputs.sha }}
          path: ljos-ui
      # The workspace names filmcraft's crates by path, so cargo needs
      # the submodule to read the workspace even where ljos does not use it.
      - run: git -C ljos-ui submodule update --init --depth 1 third_party/filmcraft
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.9.9
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ljos-ui
      # Font discovery links fontconfig and the audio sink ALSA.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libasound2-dev pkg-config
      - run: cargo test -p ljos_cli --test docs_site --locked
        working-directory: ljos-ui
      - run: cargo build -p ljos_cli --bin ljos --locked
        working-directory: ljos-ui
      # The bundle is one project: its demos import Pantry from beside them.
      - run: |
          for demo in site/src/demos/*/ site-ljos/bundle; do
            ljos-ui/target/debug/ljos check --quiet "$demo"
          done
  # The freshness guard, the supersede step and the decisions above,
  # checked: the scripts against a stubbed gh, and the workflow's
  # expressions for every way a run can start. The deploy waits on it.
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: bash .github/scripts/fresh-head.test.sh
      - run: bash .github/scripts/supersede.test.sh
      - run: node --test .github/scripts/site-expressions.test.mjs
      - run: node .github/scripts/site-expressions.test.mjs table >> "$GITHUB_STEP_SUMMARY"
  # DECISION: the one build job ran everything one step after another
  # (65 minutes for a merge to reach ljos.dev). It is split into jobs
  # that run side by side: Rust built once and handed on; each build of
  # the site in a job of its own; each e2e suite in shards. The suites
  # are all still run: every one gates the deploy as before. The full
  # e2e suite runs at the root, where ljos.dev serves the site, once on
  # each kernel (the second run is the wasm kernel, A22, not another
  # base); the project path the github.io preview stands at is held by
  # the specs about the base (base, links, canonical), as before.
  #
  # The compiler and the wasm every other job reads, built once: qmlc
  # (the build's prerenders), the compiler in the page, the kernel and
  # the 3D renderer that draws the showcase's demo. The other jobs
  # download them, so they install no Rust.
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/site-setup
        with:
          rust: "true"
          packages: "false"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The key of the one build job this replaces, so the first
          # run starts from its cache.
          shared-key: build
      - run: cargo build --bin qmlc --locked
      - run: mise run build:wasm-compiler
      - run: mise run build:wasm-3d
      - run: mise run build:kernel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-artefacts
          path: |
            target/debug/qmlc
            packages/runtime/compiler/ljos_web_compiler.wasm
            packages/runtime/kernel/ljos_web_kernel.wasm
            packages/runtime/QtQuick3D/wgpu/
          if-no-files-found: error
          retention-days: 1
  # The same site as Ljós pages, beside the Astro one: built and held
  # to parity with it, and what Pages deploys (the Astro site/dist is
  # the reference, never deployed). Its blocks are its own, not the
  # Astro build's: that one's are made for the wgpu renderer, which
  # this build does not ask for, so their stamp is not this build's.
  # Built here at a domain's root (ljos.dev), and tested from this
  # build by the jobs after it.
  site-ljos:
    needs: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: setup
        uses: ./.github/actions/site-setup
        with:
          artefacts: "true"
          docs: "true"
          browser: "true"
      # Its prerenders and pictures on the default kernel; the wasm
      # kernel's are a cache of their own (site-ljos-wasm). No key is a
      # prefix of another's, so no restore-keys answers for another.
      - id: ljos-prerenders
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            site-ljos/.codeblock-prerenders
            !site-ljos/.codeblock-prerenders/wasm
          key: codeblocks-ljos-${{ steps.setup.outputs.image }}-${{ steps.setup.outputs.inputs }}-${{ steps.setup.outputs.pictures }}
          restore-keys: codeblocks-ljos-${{ steps.setup.outputs.image }}-
      - run: pnpm --filter ljos-site-ljos build
        env:
          QMLC: ${{ github.workspace }}/target/debug/qmlc
          LJOS_SITE_BASE: /
      # Saved right after the build that fills it, so a failure after it
      # never loses it, and never saved half-made: a key is saved once.
      - if: steps.ljos-prerenders.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            site-ljos/.codeblock-prerenders
            !site-ljos/.codeblock-prerenders/wasm
          key: ${{ steps.ljos-prerenders.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-ljos-root
          path: site-ljos/dist
          include-hidden-files: true
          if-no-files-found: error
      # What the build made of each live block, which runnable.spec reads.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-ljos-report
          path: site-ljos/.codeblock-prerenders/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  # The same examples over Ljós's reactive graph (A22): built and
  # tested, never deployed.
  site-ljos-wasm:
    needs: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: setup
        uses: ./.github/actions/site-setup
        with:
          artefacts: "true"
          docs: "true"
          browser: "true"
      - id: wasm-prerenders
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site-ljos/.codeblock-prerenders/wasm
          key: codeblocks-wasm-ljos-${{ steps.setup.outputs.image }}-${{ steps.setup.outputs.inputs }}-${{ steps.setup.outputs.pictures }}
          restore-keys: codeblocks-wasm-ljos-${{ steps.setup.outputs.image }}-
      - run: pnpm --filter ljos-site-ljos build
        env:
          QMLC: ${{ github.workspace }}/target/debug/qmlc
          LJOS_SITE_BASE: /
          LJOS_KERNEL: wasm
      - if: steps.wasm-prerenders.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site-ljos/.codeblock-prerenders/wasm
          key: ${{ steps.wasm-prerenders.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-ljos-wasm
          path: site-ljos/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  # The site below a project path (the github.io preview, /<repo>/):
  # built, and held to what the base decides: the base itself, and
  # every link and the 404 page at it. After the root build, whose
  # prerenders it reads from the cache that build saved rather than
  # making them again.
  site-ljos-project:
    needs: [rust, site-ljos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: setup
        uses: ./.github/actions/site-setup
        with:
          artefacts: "true"
          docs: "true"
          browser: "true"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            site-ljos/.codeblock-prerenders
            !site-ljos/.codeblock-prerenders/wasm
          key: codeblocks-ljos-${{ steps.setup.outputs.image }}-${{ steps.setup.outputs.inputs }}-${{ steps.setup.outputs.pictures }}
          restore-keys: codeblocks-ljos-${{ steps.setup.outputs.image }}-
      - run: pnpm --filter ljos-site-ljos build
        env:
          QMLC: ${{ github.workspace }}/target/debug/qmlc
          LJOS_SITE_BASE: /${{ github.event.repository.name }}/
      - run: pnpm --filter ljos-site-ljos exec playwright test tests/base.spec.js tests/links.spec.js tests/canonical.spec.js
        env:
          LJOS_SITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: site-ljos-project-test-results
          path: site-ljos/test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-ljos-dist
          path: site-ljos/dist
          include-hidden-files: true
          if-no-files-found: error
  # The root build's own suite: parity with the Astro site and the
  # docs, the brand, the payload, every live block's report.
  site-ljos-test:
    needs: [site-ljos, astro]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/site-setup
        with:
          artefacts: "true"
          docs: "true"
          browser: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-ljos-root
          path: site-ljos/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-ljos-report
          path: site-ljos/.codeblock-prerenders
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site/dist
      - run: pnpm --filter ljos-site-ljos test
        env:
          LJOS_SITE_BASE: /
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: site-ljos-test-results
          path: site-ljos/test-results
  # Every live example and demo driven as a reader drives it, in a
  # browser with WebAssembly and in one without (e2e/), on the root
  # build. The suite is fully parallel, so it is cut into shards that
  # run side by side.
  e2e:
    needs: site-ljos
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/site-setup
        with:
          browser: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-ljos-root
          path: site-ljos/dist
      - run: pnpm --filter ljos-site-ljos test:e2e --shard=${{ matrix.shard }}/4
        env:
          LJOS_SITE_BASE: /
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: site-ljos-e2e-${{ matrix.shard }}-test-results
          path: site-ljos/test-results
  # The same suite on the wasm kernel's build.
  e2e-wasm:
    needs: site-ljos-wasm
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/site-setup
        with:
          browser: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-ljos-wasm
          path: site-ljos/dist
      - run: pnpm --filter ljos-site-ljos test:e2e --shard=${{ matrix.shard }}/4
        env:
          LJOS_SITE_BASE: /
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: site-ljos-e2e-wasm-${{ matrix.shard }}-test-results
          path: site-ljos/test-results
  # The Astro site, the reference the Ljós site is held to: built here
  # and handed to the parity suite as soon as it is built, then tested
  # in astro-test.
  astro:
    needs: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: setup
        uses: ./.github/actions/site-setup
        with:
          artefacts: "true"
          docs: "true"
          browser: "true"
      - id: astro-prerenders
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.codeblock-prerenders
          key: codeblocks-astro-${{ steps.setup.outputs.image }}-${{ steps.setup.outputs.inputs }}
          restore-keys: codeblocks-astro-${{ steps.setup.outputs.image }}-
      # Prerenders each live block (and fails on one that claims to
      # run and does not) before the build embeds them. Under the
      # environment of the build after it: the build embeds only what
      # was made under its own stamp. The wasm-kernel build in
      # astro-test has another, so it embeds none, and only its
      # showcase and site specs run, which read no prerender.
      - run: pnpm --filter ljos-site codeblock-prerenders
        env:
          VITE_LJOS_VIEW3D: wgpu
      - if: steps.astro-prerenders.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.codeblock-prerenders
          key: ${{ steps.astro-prerenders.outputs.cache-primary-key }}
      # Starlight runs Pagefind through a shell (DEP0190): its warning,
      # not ours, and one this build cannot act on.
      # Stops if it would embed no prerender: the step above was run
      # under another environment than this build's.
      - run: pnpm --filter ljos-site build
        env:
          VITE_LJOS_VIEW3D: wgpu
          LJOS_PRERENDERS_REQUIRED: "1"
          NODE_OPTIONS: --disable-warning=DEP0190
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist
          include-hidden-files: true
          if-no-files-found: error
  astro-test:
    needs: astro
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/site-setup
        with:
          artefacts: "true"
          docs: "true"
          browser: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site/dist
      # The pages as the build synced them, for the specs that read them.
      - run: pnpm --filter ljos-site sync-docs
      - run: pnpm --filter ljos-site check-links
      - run: pnpm --filter ljos-site test
      # The same suite over Ljós's reactive graph (A22): a second
      # build of the same pages, then the showcase specs on it.
      - run: pnpm --filter ljos-site build
        env:
          VITE_LJOS_VIEW3D: wgpu
          LJOS_KERNEL: wasm
          NODE_OPTIONS: --disable-warning=DEP0190
      - run: pnpm --filter ljos-site exec playwright test tests/showcase.spec.js tests/site.spec.js
      # The live blocks on a site built from fixture docs, strictly.
      # After the ordinary suite: its setup syncs the fixture's pages.
      - run: pnpm --filter ljos-site test:codeblocks
        env:
          NODE_OPTIONS: --disable-warning=DEP0190
  # The Pages artifact: the root build or the project-path one, picked
  # by where Pages serves this repository.
  build:
    needs: [site-ljos, site-ljos-project]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The pages step reads the repository's Pages domain.
      pages: read
    # Whether this run deploys, and to the custom domain, said once:
    # a push to main in hal-c2/ljos-web deploys the domain build; a
    # dispatch deploys as its inputs ask. A pull request has no
    # inputs and is not a push, so both are false there. The deploy
    # steps read these, and the fresh and deploy jobs read the outputs.
    env:
      SITE_DEPLOYS: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hal-c2/ljos-web') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
      SITE_CUSTOM_DOMAIN: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hal-c2/ljos-web') || (github.event_name == 'workflow_dispatch' && inputs.custom_domain) }}
    outputs:
      deploy: ${{ env.SITE_DEPLOYS }}
      custom-domain: ${{ env.SITE_CUSTOM_DOMAIN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ env.SITE_DEPLOYS == 'true' }}
        with:
          name: site-ljos-root
          path: ${{ runner.temp }}/site-ljos-root
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ env.SITE_DEPLOYS == 'true' }}
        with:
          name: site-ljos-dist
          path: ${{ runner.temp }}/site-ljos-project
      # DECISION: Pages serves site-ljos (the Ljós-built site), never
      # the Astro reference. Every merge to main deploys, in
      # hal-c2/ljos-web only: the root build and a CNAME naming the
      # domain, for ljos.dev. A manual dispatch deploys when it asks
      # to: by default the github.io preview, under the project path;
      # with custom_domain, the root build and CNAME as a merge does,
      # from main only: the custom domain serves main, and a branch's
      # build there would stay live until the next merge.
      # The domain itself is the repository's Pages setting, set by
      # hand once DNS is in place (GitHub ignores a CNAME file in an
      # Actions deploy; the file records the intent). Pages serves the
      # deploy wherever that setting says, and a build for the other
      # place breaks every link, so a run whose custom domain
      # disagrees with it fails instead of deploying: a merge, or a
      # dispatch with custom_domain, with no domain set; a preview
      # dispatch once one is. The CNAME names the setting, so a fork
      # never claims ljos.dev. A rollback may deploy a branch's build
      # to the domain: that is how an older commit goes live there,
      # and the freshness guard holds it to a commit main holds.
      - name: The site Pages serves
        if: ${{ env.SITE_DEPLOYS == 'true' }}
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback }}
        run: |
          # A 404 is a repository whose Pages is not set up yet: no domain.
          if domain=$(gh api "repos/$REPO/pages" --jq '.cname // ""' 2>"$RUNNER_TEMP/pages.err"); then
            :
          elif grep -q "HTTP 404" "$RUNNER_TEMP/pages.err"; then
            domain=""
          else
            cat "$RUNNER_TEMP/pages.err" >&2
            exit 1
          fi
          if [ "$SITE_CUSTOM_DOMAIN" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$ROLLBACK" != "true" ]; then
              echo "::error::only main deploys to the Pages custom domain, and this run is on $GITHUB_REF: dispatch from main, deploy the github.io preview with custom_domain off, or turn rollback on to put this branch's commit live on purpose"
              exit 1
            fi
            if [ -z "$domain" ]; then
              echo "::error::this run deploys to the Pages custom domain (a push to main, or custom_domain on), but $REPO has no Pages custom domain: set it first (site-ljos/README.md, steps 1-4)"
              exit 1
            fi
            dir="$RUNNER_TEMP/site-ljos-root"
            echo "$domain" > "$dir/CNAME"
          else
            if [ -n "$domain" ]; then
              echo "::error::Pages serves $REPO at the root of $domain, where the project-path build breaks every link: dispatch with custom_domain on"
              exit 1
            fi
            dir="$RUNNER_TEMP/site-ljos-project"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      # Uploaded whether or not it is still the newest site: the fresh
      # job decides that once the suites have passed, and an artifact
      # is all this costs a run that will not deploy.
      # Hidden files are kept, as v3 kept them: the tarball Pages
      # serves holds what the directory does.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ env.SITE_DEPLOYS == 'true' }}
        with:
          path: ${{ steps.pages.outputs.dir }}
          include-hidden-files: true
  # Whether this run's build is still the newest site its branch
  # holds, asked once the build and every suite passed and before the
  # deploy takes its turn in the Pages group: a newer merge that
  # changes the site may have landed while this run built. A push's
  # stale build answers fresh=false and the deploy is skipped, so it
  # never waits behind a deploy in flight, or holds the newer one up;
  # a dispatch's fails here, before it would take a turn. No
  # concurrency of its own: it takes seconds and waits for no one.
  fresh:
    if: ${{ needs.build.outputs.deploy == 'true' }}
    needs: [build, check, guard, site-ljos-test, e2e, e2e-wasm, astro-test]
    runs-on: ubuntu-24.04
    permissions:
      # The checkout, and its branch's head.
      contents: read
    outputs:
      fresh: ${{ steps.fresh.outputs.fresh }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Still the head of its branch
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback }}
        run: .github/scripts/fresh-head.sh
  deploy:
    if: ${{ needs.fresh.outputs.fresh == 'true' }}
    # Nothing is published that `ljos check` refused, while the
    # freshness guard fails its own test, or that is no longer the
    # newest site.
    needs: [build, check, guard, site-ljos-test, e2e, e2e-wasm, astro-test, fresh]
    runs-on: ubuntu-24.04
    # One deploy at a time to each place Pages serves, and one in
    # flight is never cancelled. A waiting one is replaced by a newer
    # one to wait, which is how a newer push supersedes an older
    # pending deploy; the freshness guard below keeps an older commit
    # from landing after a newer one whatever order the turns come in.
    # The custom domain (main's deploys, and a rollback to it) and the
    # github.io preview (a dispatch, only while Pages has no custom
    # domain) take turns apart, so a preview dispatch never replaces a
    # merge's waiting deploy.
    concurrency:
      group: ${{ needs.build.outputs.custom-domain == 'true' && 'pages' || 'pages-preview' }}
      cancel-in-progress: false
    permissions:
      # The freshness guard's checkout, and its branch's head.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      # Again, right before deploy-pages: a newer merge that changes the
      # site may have landed while this run waited its turn, or this
      # re-runs only the deploy of an older run.
      - name: Still the head of its branch
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback }}
        run: .github/scripts/fresh-head.sh
      - id: deployment
        if: ${{ steps.fresh.outputs.fresh == 'true' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
