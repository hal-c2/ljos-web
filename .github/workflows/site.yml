name: site

on:
  # A pull request builds and tests, and never deploys. The paths are
  # everything the build reads: a file left out here is a merge that
  # changes the site and never deploys it.
  pull_request:
    paths: ["site/**", "site-ljos/**", "packages/**", "crates/**", "vendor/**", "mise-tasks/**", "mise.toml", "Cargo.toml", "Cargo.lock", ".cargo/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/site.yml", ".github/scripts/**"]
  # A merge to main is live: it deploys to the repository's Pages
  # custom domain (ljos.dev). The same paths as pull_request, so what
  # a pull request was held to is what deploys.
  push:
    branches: [main]
    paths: ["site/**", "site-ljos/**", "packages/**", "crates/**", "vendor/**", "mise-tasks/**", "mise.toml", "Cargo.toml", "Cargo.lock", ".cargo/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/site.yml", ".github/scripts/**"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy site-ljos to GitHub Pages (the github.io preview unless custom_domain)"
        type: boolean
        default: false
      custom_domain:
        description: "Build for the repository's Pages custom domain, at its root, and ship its CNAME (only once DNS and the domain are set; see site-ljos/README.md)"
        type: boolean
        default: false
      rollback:
        description: "Deploy even though this commit is not its branch's head any more: to put an older commit live on purpose (see site-ljos/README.md)"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push supersedes a pull request's run. A deploying run (a push
# to main in hal-c2/ljos-web, or a dispatch with deploy on) is never
# cancelled once running, so a deploy it asked for is not lost. Every
# deploying run on main shares one group, so one at a time builds and
# deploys. The group does not keep them in order: it holds one run
# waiting, which a newer one to wait replaces (a re-run of an old run
# included), and GitHub does not promise to start waiting runs in the
# order they were made. What keeps an older commit from landing after
# a newer one is the freshness guard (.github/scripts/fresh-head.sh):
# right before upload, and again right before deploy-pages, it fails
# the run unless its commit is still its branch's head. A dispatch with
# rollback on passes it, to put an older commit live on purpose. A
# re-run of an old run that replaced a newer waiting one fails the
# guard, and the newer commit goes live with the next merge or a
# dispatch from main.
# A deploying dispatch from another branch stands alone, so it never
# replaces a merge's waiting deploy: it can only deploy the github.io
# preview, while Pages has no custom domain (the pages step refuses
# anything else), unless it is a rollback to the custom domain, which
# takes its turn among main's deploys. A dispatch that only builds
# stands alone too, and a fork's push to its main, which never
# deploys, is superseded like a pull request. The group is decided
# before any job runs, so it says "deploys" in the words the build
# job's SITE_DEPLOYS says it in.
concurrency:
  group: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hal-c2/ljos-web') || (github.event_name == 'workflow_dispatch' && inputs.deploy && (github.ref == 'refs/heads/main' || (inputs.rollback && inputs.custom_domain)))) && 'site-deploy' || (github.event_name == 'workflow_dispatch' && format('site-dispatch-{0}', github.run_id) || format('site-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hal-c2/ljos-web') }}

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Every QML file both sites show is checked by `ljos check` at the
  # pinned revision: the demos, and the docs' blocks through ljos-ui's
  # own docs_site test, which knows each fence's harness and what is
  # still listed as missing. A job of its own so it runs beside the
  # long build rather than after it.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: pin
        run: echo "sha=$(cat site/ljos-ui.sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hal-c2/ljos-ui
          ref: ${{ steps.pin.outputs.sha }}
          path: ljos-ui
      # The workspace names filmcraft's crates by path, so cargo needs
      # the submodule to read the workspace even where ljos does not use it.
      - run: git -C ljos-ui submodule update --init --depth 1 third_party/filmcraft
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.9.9
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ljos-ui
      # Font discovery links fontconfig and the audio sink ALSA.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libasound2-dev pkg-config
      - run: cargo test -p ljos_cli --test docs_site --locked
        working-directory: ljos-ui
      - run: cargo build -p ljos_cli --bin ljos --locked
        working-directory: ljos-ui
      # The bundle is one project: its demos import Pantry from beside them.
      - run: |
          for demo in site/src/demos/*/ site-ljos/bundle; do
            ljos-ui/target/debug/ljos check --quiet "$demo"
          done
  # The freshness guard and the decisions above, checked: the guard
  # against a stubbed gh, and the workflow's expressions for every way
  # a run can start. The deploy waits on it.
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: bash .github/scripts/fresh-head.test.sh
      - run: node --test .github/scripts/site-expressions.test.mjs
      - run: node .github/scripts/site-expressions.test.mjs table >> "$GITHUB_STEP_SUMMARY"
  build:
    runs-on: ubuntu-24.04
    permissions:
      # The checkout, and the freshness guard's read of its branch's head.
      contents: read
      # The deploy step reads the repository's Pages domain.
      pages: read
    # Whether this run deploys, and to the custom domain, said once:
    # a push to main in hal-c2/ljos-web deploys the domain build; a
    # dispatch deploys as its inputs ask. A pull request has no
    # inputs and is not a push, so both are false there. The deploy
    # steps read these, and the deploy job reads `deploy` below.
    env:
      SITE_DEPLOYS: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hal-c2/ljos-web') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
      SITE_CUSTOM_DOMAIN: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hal-c2/ljos-web') || (github.event_name == 'workflow_dispatch' && inputs.custom_domain) }}
    outputs:
      deploy: ${{ env.SITE_DEPLOYS }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Docs, at the pinned ljos-ui revision
        run: |
          git clone https://github.com/hal-c2/ljos-ui "$RUNNER_TEMP/ljos-ui"
          git -C "$RUNNER_TEMP/ljos-ui" checkout "$(cat site/ljos-ui.sha)"
          echo "LJOS_DOCS_DIR=$RUNNER_TEMP/ljos-ui/docs/site" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.9.9
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      - run: cargo build --bin qmlc --locked
      # The compiler in the page: a live code block fetches it on its
      # first compile in a reader's browser, and the prerender step
      # renders with the same compiler built ahead of time.
      - run: mise run build:wasm-compiler
      # The showcase's 3D demo is drawn by the wgpu renderer, and
      # the showcase suite runs again over Ljós's own kernel.
      - run: mise run build:wasm-3d
      - run: mise run build:kernel
      - run: pnpm --filter ljos-site exec playwright install --with-deps chromium
      # Prerenders each live block (and fails on one that claims to
      # run and does not) before the build embeds them.
      - run: pnpm --filter ljos-site codeblock-prerenders
      - run: pnpm --filter ljos-site build
        env:
          VITE_LJOS_VIEW3D: wgpu
      - run: pnpm --filter ljos-site check-links
      - run: pnpm --filter ljos-site test
      # The same suite over Ljós's reactive graph (A22): a second
      # build of the same pages, then the showcase specs on it.
      - run: pnpm --filter ljos-site build
        env:
          VITE_LJOS_VIEW3D: wgpu
          LJOS_KERNEL: wasm
      - run: pnpm --filter ljos-site exec playwright test tests/showcase.spec.js tests/site.spec.js
      # The artifact (and a dispatch's deploy) is the ordinary build
      # again, not the wasm-kernel one the tests just ran on.
      - run: pnpm --filter ljos-site build
        env:
          VITE_LJOS_VIEW3D: wgpu
      # The live blocks on a site built from fixture docs, strictly.
      # After the ordinary suite: its setup syncs the fixture's pages.
      - run: pnpm --filter ljos-site test:codeblocks
      # The same site as Ljós pages, beside the Astro one: built and
      # held to parity with it, uploaded as its own artifact, and what
      # Pages deploys (the Astro site/dist is the reference, never
      # deployed). The wasm compiler is built above, for the Astro
      # build's blocks.
      - run: mise run build:kernel
      # The build draws each live block's picture in a browser.
      - run: pnpm --filter ljos-site-ljos exec playwright install --with-deps chromium
      # Built twice, once for each place it stands: at a domain's
      # root (ljos.dev), the whole suite; then below a project path
      # (the github.io preview, /<repo>/), what the base decides.
      # Each build is kept for the deploy to pick from.
      - run: pnpm --filter ljos-site-ljos build
        env:
          QMLC: ${{ github.workspace }}/target/debug/qmlc
          LJOS_SITE_BASE: /
      - run: pnpm --filter ljos-site-ljos test
        env:
          LJOS_SITE_BASE: /
      - run: cp -r site-ljos/dist "$RUNNER_TEMP/site-ljos-root"
      - run: pnpm --filter ljos-site-ljos build
        env:
          QMLC: ${{ github.workspace }}/target/debug/qmlc
          LJOS_SITE_BASE: /${{ github.event.repository.name }}/
      - run: pnpm --filter ljos-site-ljos exec playwright test tests/base.spec.js tests/canonical.spec.js
        env:
          LJOS_SITE_BASE: /${{ github.event.repository.name }}/
      - run: cp -r site-ljos/dist "$RUNNER_TEMP/site-ljos-project"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ failure() }}
        with:
          name: site-ljos-test-results
          path: site-ljos/test-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-ljos-dist
          path: ${{ runner.temp }}/site-ljos-project
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-dist
          path: site/dist
      # DECISION: Pages serves site-ljos (the Ljós-built site), never
      # the Astro reference. Every merge to main deploys, in
      # hal-c2/ljos-web only: the root build and a CNAME naming the
      # domain, for ljos.dev. A manual dispatch deploys when it asks
      # to: by default the github.io preview, under the project path;
      # with custom_domain, the root build and CNAME as a merge does,
      # from main only: the custom domain serves main, and a branch's
      # build there would stay live until the next merge.
      # The domain itself is the repository's Pages setting, set by
      # hand once DNS is in place (GitHub ignores a CNAME file in an
      # Actions deploy; the file records the intent). Pages serves the
      # deploy wherever that setting says, and a build for the other
      # place breaks every link, so a run whose custom domain
      # disagrees with it fails instead of deploying: a merge, or a
      # dispatch with custom_domain, with no domain set; a preview
      # dispatch once one is. The CNAME names the setting, so a fork
      # never claims ljos.dev. A rollback may deploy a branch's build
      # to the domain: that is how an older commit goes live there.
      - name: The site Pages serves
        if: ${{ env.SITE_DEPLOYS == 'true' }}
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback }}
        run: |
          # A 404 is a repository whose Pages is not set up yet: no domain.
          if domain=$(gh api "repos/$REPO/pages" --jq '.cname // ""' 2>"$RUNNER_TEMP/pages.err"); then
            :
          elif grep -q "HTTP 404" "$RUNNER_TEMP/pages.err"; then
            domain=""
          else
            cat "$RUNNER_TEMP/pages.err" >&2
            exit 1
          fi
          if [ "$SITE_CUSTOM_DOMAIN" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$ROLLBACK" != "true" ]; then
              echo "::error::only main deploys to the Pages custom domain, and this run is on $GITHUB_REF: dispatch from main, deploy the github.io preview with custom_domain off, or turn rollback on to put this branch's commit live on purpose"
              exit 1
            fi
            if [ -z "$domain" ]; then
              echo "::error::this run deploys to the Pages custom domain (a push to main, or custom_domain on), but $REPO has no Pages custom domain: set it first (site-ljos/README.md, steps 1-4)"
              exit 1
            fi
            dir="$RUNNER_TEMP/site-ljos-root"
            echo "$domain" > "$dir/CNAME"
          else
            if [ -n "$domain" ]; then
              echo "::error::Pages serves $REPO at the root of $domain, where the project-path build breaks every link: dispatch with custom_domain on"
              exit 1
            fi
            dir="$RUNNER_TEMP/site-ljos-project"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      # As late as it can be before upload: a newer merge may have
      # landed while this run built.
      - name: Still the head of its branch
        if: ${{ env.SITE_DEPLOYS == 'true' }}
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback }}
        run: .github/scripts/fresh-head.sh
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: ${{ env.SITE_DEPLOYS == 'true' }}
        with:
          path: ${{ steps.pages.outputs.dir }}
  deploy:
    if: ${{ needs.build.outputs.deploy == 'true' }}
    # Nothing is published that `ljos check` refused, or while the
    # freshness guard fails its own test.
    needs: [build, check, guard]
    runs-on: ubuntu-24.04
    # One deploy at a time, and one in flight is never cancelled. A
    # waiting one may be replaced here too; the freshness guard below
    # is what keeps an older commit from landing after a newer one.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      # The freshness guard's checkout, and its branch's head.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      # Again, right before deploy-pages: a newer merge may have landed
      # while this run waited its turn, or this re-runs only the deploy
      # of an older run.
      - name: Still the head of its branch
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback }}
        run: .github/scripts/fresh-head.sh
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
