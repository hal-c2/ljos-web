name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request's newer push replaces its older run. Every run of main is kept to its end, so
# main is never left without a verdict: each main run has a group of its own, because a group
# that holds one running run and one pending run drops the pending one when a third arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ljos-ui is public, but Cargo.lock names it by ssh, and a runner has no key.
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # The workspace's test binaries each hold a whole compiler; a panic still names its line.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # How both workflows key their caches; here, as ci runs on every
      # change, where site.yml runs only on the site's paths.
      - run: node --test .github/scripts/caches.test.mjs
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.9.9
      # The Rust caches are saved from main only, one per key, and read
      # by every branch: a pull request's own would be one more copy of
      # main's, and they filled the repository's 10 GB until the site's
      # caches were evicted between runs. This job's clippy and tests
      # are a build of their own; the others read the build key that
      # site.yml's rust job saves (qmlc and the wasm), what they build
      # is part of it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # What `mise run check` runs locally, run the same way here: rustfmt,
      # clippy, the TypeScript types and the code grammar's tests. It runs
      # each whatever came before it and names every one that failed.
      - run: mise run check
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
      - if: ${{ !cancelled() }}
        run: cargo test --workspace --no-fail-fast --locked

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.9.9
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: build
          save-if: false
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # This file starts low in a stack of pull requests, below the live shell
      # and the site builder. It says so rather than passing quietly; once they
      # have landed this step and its conditions can go.
      - id: stack
        run: |
          if [ -e packages/runtime/tests/drop.spec.js ] && [ -e packages/runtime/site-tests ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::site-tests and drop.spec.js are not on this branch yet: nothing run in this job"
          fi
      # Chromium, kept between runs by Playwright's version (one in the
      # lockfile); what it needs of the system is installed each run.
      - id: playwright
        run: echo "version=$(sed -n 's/^  playwright@\([0-9.]*\):$/\1/p' pnpm-lock.yaml | head -n1)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - id: setup
        if: steps.stack.outputs.present == 'true'
        env:
          BROWSERS_KEPT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          pnpm install --frozen-lockfile
          cargo build --bin qmlc --locked
          mise run build:wasm-compiler
          mise run build:kernel
          if [ "$BROWSERS_KEPT" = "true" ]; then
            pnpm --filter ljos-web exec playwright install-deps chromium
          else
            pnpm --filter ljos-web exec playwright install --with-deps chromium
          fi
      # Saved as soon as it is installed: a cache saved at the job's end
      # is lost to any failing test after it.
      - if: steps.setup.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      # The types and the code grammar are checked in the check job
      # (mise run check).
      # Each whatever came before it, so one run shows which kernel a failure is on.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --filter ljos-web test:site
      - name: the kernel a page runs, by default
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --filter ljos-web exec playwright test -c tests kernelchoice
      - name: the opt-in wasm kernel, with WebAssembly and without
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          LJOS_KERNEL: wasm
        run: pnpm --filter ljos-web exec playwright test -c tests kernelchoice
      # accessible.spec: what a page tells assistive tools and tests, such as
      # an item's objectName on its element.
      - name: what a page tells assistive tools, on the Solid kernel
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --filter ljos-web exec playwright test -c tests accessible.spec
      # messages.spec: ljos-ui's features/i18n/messages.feature, compiled in the page.
      # compiler.spec: what the page compiles is what qmlc makes of the same
      # files, and compiled QML may import every module the runtime exports
      # but those a page puts together, so a new export is not left out.
      - name: drop, messages and the compiler in the page, on the Solid kernel
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --filter ljos-web exec playwright test -c tests drop live.spec messages.spec compiler.spec
      - name: drop, messages and the compiler in the page, on the wasm kernel
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          LJOS_KERNEL: wasm
        run: pnpm --filter ljos-web exec playwright test -c tests drop live.spec messages.spec compiler.spec
      # The 3D scenes on the JavaScript renderer, which asks for no GPU of its
      # own (Chromium draws its WebGL2 in software here). A View3D made late,
      # as a Loader makes one, is among them. Those lit by a picture of their
      # surroundings take software GL longer than a test is given beside the
      # others: they run after, one at a time, each given longer.
      - name: Quick3D, on the Solid kernel
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --filter ljos-web exec playwright test -c tests quick3d.spec paced.spec --grep-invert @surroundings
      - name: Quick3D lit by its surroundings, one at a time, on the Solid kernel
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --filter ljos-web exec playwright test -c tests quick3d.spec --grep @surroundings --workers=1 --timeout=120000

  # Its own job, as what it needs of ljos-ui is not what the others need.
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.9.9
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: build
          save-if: false
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # The example's Rust is also a desktop application, whose text finds fonts by fontconfig.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config
      # Chromium, kept between runs by Playwright's version (one in the
      # lockfile); what it needs of the system is installed each run.
      - id: playwright
        run: echo "version=$(sed -n 's/^  playwright@\([0-9.]*\):$/\1/p' pnpm-lock.yaml | head -n1)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - env:
          BROWSERS_KEPT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          pnpm install --frozen-lockfile
          if [ "$BROWSERS_KEPT" = "true" ]; then
            pnpm --filter ljos-web exec playwright install-deps chromium
          else
            pnpm --filter ljos-web exec playwright install --with-deps chromium
          fi
      - if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - run: mise run test:wasm-counter

  # Every mise task, in a quick mode that does not build (tasks/smoke says
  # which run and which are only resolved), so a task that broke turns CI
  # red instead of the next person who runs it.
  tasks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.9.9
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # shellcheck comes with the runner's image; the smoke fails in CI without it.
      - run: mise run tasks:smoke
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
