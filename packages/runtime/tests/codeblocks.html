<figure class="ljos-codeblock" data-ljos-codeblock data-state="static"><div class="ljos-codeblock__head"></div><div class="ljos-codeblock__body"><div class="ljos-codeblock__code"><div class="ljos-codeblock__source" data-file="Main.qml"><p class="ljos-codeblock__file">Main.qml</p><pre><code class="language-qml">import QtQuick
import Ljos.Blocks

Rectangle {
    width: 280
    height: 160
    color: &quot;#20242e&quot;
    QtObject {
        id: counter
        property int count: 0
    }
    Contribution {
        slot: &quot;main&quot;
        Text {
            objectName: &quot;counter-view&quot;
            color: &quot;#e8eaf0&quot;
            text: &quot;Count: &quot; + counter.count
        }
    }
    ShellLoader {
        anchors.fill: parent
        source: &quot;user/Shell.qml&quot;
        fallback: &quot;Default.qml&quot;
    }
    MouseArea {
        anchors.fill: parent
        onClicked: counter.count = counter.count + 1
    }
}</code></pre></div><div class="ljos-codeblock__source" data-file="user/Shell.qml"><p class="ljos-codeblock__file">user/Shell.qml</p><pre><code class="language-qml">import QtQuick
